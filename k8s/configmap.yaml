apiVersion: v1
kind: ConfigMap
metadata:
  name: ems-config
  namespace: ems-production
data:
  NODE_ENV: "production"
  PORT: "4000"
  API_PREFIX: "/api/v1"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  S3_ENDPOINT: "minio-service"
  S3_PORT: "9000"
  S3_BUCKET: "ems-documents"
  LOG_LEVEL: "info"
