name: Monorepo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ems_admin
          POSTGRES_PASSWORD: ems_secure_password_123!
          POSTGRES_DB: ems_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.5.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate Client
        run: pnpm --filter @ems/database db:generate
        env:
          DATABASE_URL: postgresql://ems_admin:ems_secure_password_123!@localhost:5432/ems_db?schema=public

      - name: Lint Check
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Automated Tests with Coverage
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ems_admin:ems_secure_password_123!@localhost:5432/ems_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-minimum-64-characters-long-key-for-jwt-signing
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-64-characters-long-key-for-jwt-rotation

      - name: Build All Workspaces
        run: pnpm build
